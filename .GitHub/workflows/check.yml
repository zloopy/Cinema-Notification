name: Vérifier les ressorties de films

on:
  schedule:
    # Tous les jours à 9h00 heure de Paris (7h00 UTC en été)
    - cron: "0 7 * * *"
  workflow_dispatch: {}  # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install allocine-seances requests

      - name: Lancer la vérification
        env:
          NTFY_TOPIC: ${{ secrets.cinema-notifs }}
        run: python check_films.py

      - name: Sauvegarder l'état (séances déjà notifiées)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Mise à jour state.json"
          git push
